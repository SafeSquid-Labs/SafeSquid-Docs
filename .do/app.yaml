alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

features:
  - buildpack-stack=ubuntu-22

name: docs
region: blr

static_sites:
  - name: safesquid-docs
    github:
      repo: SafeSquid-Labs/SafeSquid-Docs
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build && mkdir -p build && unzip -o build.zip -d build
    output_dir: build
    index_document: index.html
    catchall_document: index.html
    routes:
      - path: /