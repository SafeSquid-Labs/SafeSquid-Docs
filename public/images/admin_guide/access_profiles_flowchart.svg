<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="Access Profiles row gate flow">
<style>
    .box { fill: #f5f8fa; stroke: #0066aa; stroke-width: 1.5; }
    .boxWarn { fill: #fdf6f0; stroke: #c45c26; stroke-width: 1.5; }
    .boxOk { fill: #f0f7f0; stroke: #2d6a2d; stroke-width: 1.5; }
    .arrow { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .yn { font-size: 11px; fill: #555; font-weight: 600; }
    text { font-size: 12px; font-family: system-ui, sans-serif; fill: #222; }
    text.label { font-weight: 600; }
</style>
<rect x="0" y="0" width="480" height="400" fill="#ffffff"/>
<defs>
				<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#444"/>
				</marker>
			</defs>
			<rect class="box" x="120" y="8" width="240" height="36" rx="4"/>
			<text class="label" x="240" y="30" text-anchor="middle">profiles_update()</text>
			<line class="arrow" x1="240" y1="44" x2="240" y2="58"/>
			<rect class="box" x="80" y="58" width="320" height="36" rx="4"/>
			<text x="240" y="80" text-anchor="middle">Default Policies then Secondary</text>
			<line class="arrow" x1="240" y1="94" x2="240" y2="108"/>
			<rect class="box" x="40" y="108" width="400" height="52" rx="4"/>
			<text x="240" y="126" text-anchor="middle">Gates: proxyhost → profiles → time →</text>
			<text x="240" y="142" text-anchor="middle">categories → req_types → user_groups → resp_types</text>
			<line class="arrow" x1="240" y1="160" x2="240" y2="174"/>
			<rect class="boxOk" x="90" y="174" width="300" height="36" rx="4"/>
			<text x="240" y="196" text-anchor="middle">Add/remove profiles; update Action</text>
			<line class="arrow" x1="240" y1="210" x2="240" y2="224"/>
			<rect class="box" x="100" y="224" width="280" height="36" rx="4"/>
			<text x="240" y="246" text-anchor="middle">Next row (cumulative — no stop)</text>
			<line class="arrow" x1="240" y1="260" x2="240" y2="274"/>
			<rect class="boxWarn" x="80" y="274" width="320" height="44" rx="4"/>
			<text x="240" y="292" text-anchor="middle">action ≠ Allow → block template</text>
			<text x="240" y="308" text-anchor="middle">451 + bypass cookie if Allow bypassing</text>
</svg>
