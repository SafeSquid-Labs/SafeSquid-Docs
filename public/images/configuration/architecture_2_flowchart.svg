<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1360" width="680" height="1360" role="img" aria-label="Request pipeline using Web UI section names">
<style>
    .box { fill: #f5f8fa; stroke: #0066aa; stroke-width: 1.5; }
    .boxWarn { fill: #fdf6f0; stroke: #c45c26; stroke-width: 1.5; }
    .boxOk { fill: #f0f7f0; stroke: #2d6a2d; stroke-width: 1.5; }
    .arrow { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .yn { font-size: 11px; fill: #555; font-weight: 600; }
    text { font-size: 12px; font-family: system-ui, sans-serif; fill: #222; }
    text.label { font-weight: 600; }
</style>
<rect x="0" y="0" width="680" height="1360" fill="#ffffff"/>
<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#444"/></marker></defs>
<rect class="box" x="40" y="8" width="300" height="32" rx="4"/>
			<text class="label" x="190" y="28" text-anchor="middle">Network settings</text>
			<line class="arrow" x1="190" y1="40" x2="190" y2="52"/>
			<rect class="box" x="40" y="52" width="300" height="32" rx="4"/>
			<text x="190" y="72" text-anchor="middle">Read the request</text>
			<line class="arrow" x1="190" y1="84" x2="190" y2="96"/>
			<rect class="box" x="40" y="96" width="300" height="36" rx="4"/>
			<text x="190" y="118" text-anchor="middle">Unsafe or internal?</text>
			<text class="yn" x="348" y="110">Yes</text>
			<line class="arrow" x1="340" y1="114" x2="388" y2="114"/>
			<rect class="boxWarn" x="390" y="96" width="260" height="36" rx="4"/>
			<text x="520" y="118" text-anchor="middle">STOP: Templates</text>
			<text class="yn" x="198" y="144">No</text>
			<line class="arrow" x1="190" y1="132" x2="190" y2="156"/>
			<rect class="box" x="40" y="156" width="300" height="36" rx="4"/>
			<text x="190" y="178" text-anchor="middle">Web UI (safesquid.cfg)?</text>
			<text class="yn" x="348" y="170">Yes</text>
			<line class="arrow" x1="340" y1="174" x2="388" y2="174"/>
			<rect class="boxOk" x="390" y="148" width="260" height="52" rx="4"/>
			<text x="520" y="168" text-anchor="middle">Access restrictions</text>
			<text x="520" y="184" text-anchor="middle">then Web UI · STOP</text>
			<text class="yn" x="198" y="204">No</text>
			<line class="arrow" x1="190" y1="192" x2="190" y2="216"/>
			<rect class="box" x="40" y="216" width="300" height="80" rx="4"/>
			<text class="label" x="190" y="236" text-anchor="middle">Time Profiler</text>
			<text x="190" y="252" text-anchor="middle">Application Signatures</text>
			<text x="190" y="268" text-anchor="middle">Request Types</text>
			<text x="190" y="284" text-anchor="middle">Categorize Web-Sites · SSqore</text>
			<line class="arrow" x1="190" y1="296" x2="190" y2="312"/>
			<rect class="box" x="40" y="312" width="300" height="44" rx="4"/>
			<text class="label" x="190" y="330" text-anchor="middle">Access Profiles</text>
			<text x="190" y="346" text-anchor="middle">remember Allow or Deny</text>
			<line class="arrow" x1="190" y1="356" x2="190" y2="372"/>
			<rect class="box" x="40" y="372" width="300" height="48" rx="4"/>
			<text class="label" x="190" y="390" text-anchor="middle">Access restrictions</text>
			<text x="190" y="406" text-anchor="middle">Integrate LDAP · login / rights</text>
			<text class="yn" x="348" y="386">No</text>
			<line class="arrow" x1="340" y1="396" x2="388" y2="396"/>
			<rect class="boxWarn" x="390" y="372" width="260" height="48" rx="4"/>
			<text x="520" y="390" text-anchor="middle">STOP: login prompt</text>
			<text x="520" y="406" text-anchor="middle">or Templates refuse</text>
			<text class="yn" x="198" y="432">Yes</text>
			<line class="arrow" x1="190" y1="420" x2="190" y2="444"/>
			<rect class="box" x="40" y="444" width="300" height="32" rx="4"/>
			<text class="label" x="190" y="464" text-anchor="middle">Speed Limits</text>
			<line class="arrow" x1="190" y1="476" x2="190" y2="492"/>
			<rect class="box" x="40" y="492" width="300" height="52" rx="4"/>
			<text class="label" x="190" y="510" text-anchor="middle">Content modifier · ICAP</text>
			<text x="190" y="526" text-anchor="middle">External applications · HTTPS Inspection</text>
			<line class="arrow" x1="190" y1="544" x2="190" y2="560"/>
			<rect class="box" x="40" y="560" width="300" height="32" rx="4"/>
			<text class="label" x="190" y="580" text-anchor="middle">HTTPS or HTTP? (one only)</text>
			<line class="arrow" x1="110" y1="592" x2="110" y2="612"/>
			<line class="arrow" x1="270" y1="592" x2="270" y2="612"/>
			<text class="yn" x="110" y="608" text-anchor="middle">HTTPS</text>
			<text class="yn" x="270" y="608" text-anchor="middle">HTTP</text>
			<rect class="box" x="20" y="616" width="180" height="120" rx="4"/>
			<text class="label" x="110" y="636" text-anchor="middle">Access restrictions</text>
			<text x="110" y="652" text-anchor="middle">CONNECT right</text>
			<text class="label" x="110" y="672" text-anchor="middle">System configuration</text>
			<text x="110" y="688" text-anchor="middle">CONNECT ports</text>
			<text class="label" x="110" y="708" text-anchor="middle">HTTPS Inspection</text>
			<text x="110" y="724" text-anchor="middle">decrypt → restart</text>
			<rect class="box" x="220" y="616" width="180" height="120" rx="4"/>
			<text class="label" x="310" y="636" text-anchor="middle">Access restrictions</text>
			<text x="310" y="652" text-anchor="middle">HTTP rights</text>
			<text class="label" x="310" y="680" text-anchor="middle">Redirect</text>
			<text x="310" y="696" text-anchor="middle">match → 302 STOP</text>
			<text x="310" y="716" text-anchor="middle">else continue</text>
			<line class="arrow" x1="110" y1="736" x2="110" y2="756"/>
			<line class="arrow" x1="310" y1="736" x2="310" y2="756"/>
			<line x1="110" y1="756" x2="310" y2="756" stroke="#444" stroke-width="1.5"/>
			<line class="arrow" x1="190" y1="756" x2="190" y2="764"/>
			<rect class="box" x="40" y="764" width="300" height="48" rx="4"/>
			<text class="label" x="190" y="782" text-anchor="middle">Access Profiles</text>
			<text x="190" y="798" text-anchor="middle">now enforce Deny</text>
			<text class="yn" x="348" y="778">Deny</text>
			<line class="arrow" x1="340" y1="788" x2="388" y2="788"/>
			<rect class="boxWarn" x="390" y="764" width="260" height="48" rx="4"/>
			<text x="520" y="782" text-anchor="middle">STOP: Templates</text>
			<text x="520" y="798" text-anchor="middle">(or HTTPS Inspection)</text>
			<text class="yn" x="198" y="824">Allow</text>
			<line class="arrow" x1="190" y1="812" x2="190" y2="836"/>
			<rect class="box" x="40" y="836" width="300" height="64" rx="4"/>
			<text class="label" x="190" y="854" text-anchor="middle">Upload body (if any)</text>
			<text x="190" y="870" text-anchor="middle">Clam antivirus · SqScan</text>
			<text x="190" y="886" text-anchor="middle">Image analyzer · DLP</text>
			<text class="yn" x="348" y="850">Deny</text>
			<line class="arrow" x1="340" y1="868" x2="388" y2="868"/>
			<rect class="boxWarn" x="390" y="836" width="260" height="64" rx="4"/>
			<text x="520" y="860" text-anchor="middle">STOP: Templates</text>
			<text x="520" y="876" text-anchor="middle">malware or DLP</text>
			<text class="yn" x="198" y="912">Pass</text>
			<line class="arrow" x1="190" y1="900" x2="190" y2="924"/>
			<rect class="box" x="40" y="924" width="300" height="32" rx="4"/>
			<text class="label" x="190" y="944" text-anchor="middle">Caching</text>
			<line class="arrow" x1="190" y1="956" x2="190" y2="972"/>
			<rect class="box" x="40" y="972" width="300" height="36" rx="4"/>
			<text class="label" x="190" y="994" text-anchor="middle">DNS Blacklist</text>
			<text class="yn" x="348" y="986">Block</text>
			<line class="arrow" x1="340" y1="990" x2="388" y2="990"/>
			<rect class="boxWarn" x="390" y="972" width="260" height="36" rx="4"/>
			<text x="520" y="994" text-anchor="middle">STOP: Templates</text>
			<text class="yn" x="198" y="1020">Pass</text>
			<line class="arrow" x1="190" y1="1008" x2="190" y2="1032"/>
			<rect class="box" x="40" y="1032" width="300" height="32" rx="4"/>
			<text class="label" x="190" y="1052" text-anchor="middle">Proxy chain</text>
			<line class="arrow" x1="190" y1="1064" x2="190" y2="1080"/>
			<rect class="box" x="40" y="1080" width="300" height="48" rx="4"/>
			<text class="label" x="190" y="1098" text-anchor="middle">Header filter · Cookie filter</text>
			<text x="190" y="1114" text-anchor="middle">Elevated Privacy (to origin)</text>
			<line class="arrow" x1="190" y1="1128" x2="190" y2="1144"/>
			<rect class="box" x="40" y="1144" width="300" height="32" rx="4"/>
			<text class="label" x="190" y="1164" text-anchor="middle">Response Types</text>
			<line class="arrow" x1="190" y1="1176" x2="190" y2="1192"/>
			<rect class="box" x="40" y="1192" width="300" height="64" rx="4"/>
			<text class="label" x="190" y="1210" text-anchor="middle">Downloaded body</text>
			<text x="190" y="1226" text-anchor="middle">Access Profiles · SqScan · Clam antivirus</text>
			<text x="190" y="1242" text-anchor="middle">Image analyzer · Text analyzer · ICAP</text>
			<text class="yn" x="348" y="1206">Deny</text>
			<line class="arrow" x1="340" y1="1224" x2="388" y2="1224"/>
			<rect class="boxWarn" x="390" y="1192" width="260" height="64" rx="4"/>
			<text x="520" y="1216" text-anchor="middle">STOP: Templates</text>
			<text x="520" y="1232" text-anchor="middle">malware or content</text>
			<text class="yn" x="198" y="1268">Pass</text>
			<line class="arrow" x1="190" y1="1256" x2="190" y2="1280"/>
			<rect class="boxOk" x="40" y="1280" width="300" height="56" rx="4"/>
			<text class="label" x="190" y="1302" text-anchor="middle">Prefetching · FTP browsing</text>
			<text x="190" y="1318" text-anchor="middle">send to browser · write logs</text>
</svg>
