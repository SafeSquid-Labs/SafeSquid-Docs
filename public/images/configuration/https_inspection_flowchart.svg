<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="CONNECT policy flow">
<style>
    .box { fill: #f5f8fa; stroke: #0066aa; stroke-width: 1.5; }
