<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Request Types gate flow">
<style>
    .box { fill: #f5f8fa; stroke: #0066aa; stroke-width: 1.5; }
    .boxWarn { fill: #fdf6f0; stroke: #c45c26; stroke-width: 1.5; }
    .boxOk { fill: #f0f7f0; stroke: #2d6a2d; stroke-width: 1.5; }
    .arrow { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .yn { font-size: 11px; fill: #555; font-weight: 600; }
    text { font-size: 12px; font-family: system-ui, sans-serif; fill: #222; }
    text.label { font-weight: 600; }
</style>
<rect x="0" y="0" width="480" height="360" fill="#ffffff"/>
<defs>
				<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
					<polygon points="0 0, 8 3, 0 6" fill="#444"/>
				</marker>
			</defs>
			<rect class="box" x="130" y="8" width="220" height="36" rx="4"/>
			<text class="label" x="240" y="30" text-anchor="middle">Request with host</text>
			<line class="arrow" x1="240" y1="44" x2="240" y2="58"/>
			<rect class="box" x="60" y="58" width="360" height="44" rx="4"/>
			<text x="240" y="76" text-anchor="middle">reqprofiles → method → protocol → mime</text>
			<text x="240" y="92" text-anchor="middle">→ port → post size → file → host → headers</text>
			<line class="arrow" x1="240" y1="102" x2="240" y2="116"/>
			<rect class="boxOk" x="100" y="116" width="280" height="36" rx="4"/>
			<text x="240" y="138" text-anchor="middle">Add/remove request_types tags</text>
			<line class="arrow" x1="240" y1="152" x2="240" y2="166"/>
			<rect class="box" x="80" y="166" width="320" height="36" rx="4"/>
			<text x="240" y="188" text-anchor="middle">Next row — all matches apply</text>
			<line class="arrow" x1="240" y1="202" x2="240" y2="216"/>
			<rect class="boxWarn" x="70" y="216" width="340" height="44" rx="4"/>
			<text x="240" y="234" text-anchor="middle">Domains pass: last match sets</text>
			<text x="240" y="250" text-anchor="middle">DNSBL/categorization bypass</text>
</svg>
